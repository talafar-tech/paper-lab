<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F55D4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="קריאת מאמרים">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>מעבדת קריאת מאמרים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single centered "reading desk" column; each step is one sheet of paper with highlighter marks. */
:root{
  --bg:#EEF2F6; --sheet:#FFFFFF; --ink:#16202E; --muted:#5A6678; --line:#D3DAE4;
  --accent:#2F55D4; --accent-ink:#FFFFFF; --hl:#FFE45C; --hl-ink:#16202E;
  --good:#1F8A5B; --good-bg:#E3F4EC; --bad:#C2413A; --bad-bg:#FBE7E5;
  --f-display:"Frank Ruhl Libre","Times New Roman",serif;
  --f-body:"IBM Plex Sans Hebrew",system-ui,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151E; --sheet:#18212D; --ink:#E7ECF3; --muted:#9AA6B8; --line:#2B3746;
  --accent:#7D9BFF; --accent-ink:#0F151E; --hl:#E8C93A; --hl-ink:#14181F;
  --good:#5DD39E; --good-bg:#16322A; --bad:#FF8A80; --bad-bg:#3A1E1E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F151E; --sheet:#18212D; --ink:#E7ECF3; --muted:#9AA6B8; --line:#2B3746;
  --accent:#7D9BFF; --accent-ink:#0F151E; --hl:#E8C93A; --hl-ink:#14181F;
  --good:#5DD39E; --good-bg:#16322A; --bad:#FF8A80; --bad-bg:#3A1E1E; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
#app{max-width:720px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:2.1rem;font-weight:900}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
.en{font-family:var(--f-mono);font-size:.88em;direction:ltr;unicode-bidi:isolate}
mark{background:linear-gradient(transparent 35%,var(--hl) 35%,var(--hl) 88%,transparent 88%);color:inherit;padding:0 2px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:900;font-size:1.2rem}
.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:3px 12px;font-size:.85rem;font-variant-numeric:tabular-nums}
.toggle[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(20,30,50,.35)}
.eyebrow{font-size:.78rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.term{font-family:var(--f-mono);direction:ltr;text-align:right;font-size:.95rem;color:var(--accent)}
.take{border-inline-start:4px solid var(--hl);padding:6px 12px;background:color-mix(in srgb,var(--hl) 14%,transparent);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actions{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));flex-wrap:nowrap}
.btn,.opt{min-height:48px;-webkit-tap-highlight-color:transparent}
.btn{border:1px solid var(--line);background:var(--sheet);padding:10px 18px;border-radius:6px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.spacer{flex:1}

.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* level map */
.levels{display:grid;gap:10px}
.lvl{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);text-align:start}
.lvl .n{font-family:var(--f-display);font-weight:900;font-size:1.6rem;text-align:center;color:var(--accent)}
.lvl.locked{opacity:.55}
.lvl small{color:var(--muted);display:block;font-size:.85rem}
.lvl .state{font-size:.8rem;color:var(--muted)}

/* visuals */
.five{display:grid;gap:6px;margin:0;padding:0;list-style:none;counter-reset:q}
.five li{counter-increment:q;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:baseline}
.five li::before{content:counter(q);font-family:var(--f-display);font-weight:900;color:var(--accent);font-size:1.2rem}
.hourglass{display:flex;flex-direction:column;align-items:center;gap:4px}
.hourglass div{border:1px solid var(--line);border-radius:4px;padding:6px 10px;text-align:center;font-size:.9rem;min-width:0}
.hourglass b{font-family:var(--f-mono);font-weight:500;direction:ltr;display:block;font-size:.85rem;color:var(--accent)}
.hg-a{width:100%;background:color-mix(in srgb,var(--hl) 25%,transparent)}
.hg-i{width:92%}.hg-m{width:62%;border-width:2px!important;border-color:var(--accent)!important}.hg-r{width:62%}.hg-d{width:92%}
.paper{border:1px dashed var(--line);border-radius:4px;padding:14px;font-family:var(--f-mono);font-size:.85rem;direction:ltr;text-align:left;line-height:1.55;overflow-x:auto}
.paper strong{font-weight:500;color:var(--accent)}
.pico{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pico div{border:1px solid var(--line);border-radius:4px;padding:10px}
.pico b{font-family:var(--f-display);font-size:1.5rem;color:var(--accent);display:block;line-height:1}
.pico i{font-style:normal;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);direction:ltr;display:block}
.checklist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.checklist li{border-bottom:1px solid var(--line);padding-bottom:8px}
.checklist li:last-child{border-bottom:0}
.flow{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.88rem;font-variant-numeric:tabular-nums}
.flow .box{border:1px solid var(--line);border-radius:4px;padding:6px 12px;text-align:center}
.flow .split{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.flow .arrow{color:var(--muted);line-height:1}
.flow .drop{color:var(--bad);font-size:.8rem}
.quote{border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:grid;gap:4px}
.quote .tag{font-size:.78rem;font-weight:600;letter-spacing:.04em}
.seq{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:s}
.seq li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:baseline}
.seq li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.8rem;font-weight:700}

/* quiz */
.opts{display:grid;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--sheet);border-radius:6px;padding:12px 14px;text-align:start;font-size:1rem;line-height:1.45;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.sections{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sections .opt{text-align:center;font-family:var(--f-mono);font-size:.9rem;padding:12px 6px}
.feedback{border-radius:6px;padding:12px 14px;font-size:.98rem}
.feedback.ok{background:var(--good-bg)}
.feedback.no{background:var(--bad-bg)}
.feedback strong{display:block;margin-bottom:2px}
.snippet{font-family:var(--f-mono);direction:ltr;text-align:left;font-size:.95rem;line-height:1.6;border-inline-start:4px solid var(--accent);padding:10px 14px;background:color-mix(in srgb,var(--accent) 6%,transparent)}
.trans{color:var(--muted);font-size:.92rem}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline;font-size:.9rem}
.big{font-family:var(--f-display);font-size:3.2rem;font-weight:900;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.note{font-size:.85rem;color:var(--muted)}
.streak{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){body{font-size:18px}.actions .btn{padding:10px 14px}.actions .btn.primary{flex:1}.topbar .brand{font-size:1.05rem}.sheet{padding:18px}.sections{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:1.75rem}}
.tag{font-size:.75rem;font-weight:600;letter-spacing:.04em;color:var(--accent);display:block}
.tag-muted{color:var(--muted)}.tag-good{color:var(--good)}
.pyramid{display:flex;flex-direction:column;align-items:center;gap:4px}
.pyramid div{border:1px solid var(--line);border-radius:4px;padding:5px 8px;text-align:center;font-size:.85rem;max-width:100%}
.pyramid div:first-child{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:var(--accent)}
.pyramid b{display:block;font-family:var(--f-mono);font-weight:500;font-size:.8rem;direction:ltr;color:var(--accent)}
.example{border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:4px;background:color-mix(in srgb,var(--accent) 4%,transparent)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.three div,.compare div{border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:2px;align-content:start;font-size:.92rem}
.three b,.compare b{font-family:var(--f-display);font-size:1.1rem}
.three .en{color:var(--accent);font-size:.78rem}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bignum{font-family:var(--f-display);font-weight:900;font-size:2.2rem;color:var(--accent);line-height:1.1;font-variant-numeric:tabular-nums}
.people{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.people i{width:24px;height:34px;border-radius:12px 12px 6px 6px;background:var(--line);display:block}
.people i.on{background:var(--accent)}
.scale{position:relative;height:84px;border-top:3px solid var(--line);margin:18px 8px 0}
.scale span{position:absolute;top:6px;transform:translateX(50%);text-align:center;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.scale span.mark{top:48px;color:var(--accent);font-weight:600;white-space:nowrap;transform:translateX(30%)}
.scale span.mark::before{content:"";position:absolute;top:-50px;inset-inline-end:30%;width:3px;height:44px;background:var(--accent)}
.grade{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.grade li{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px;font-size:.92rem}
.grade .dots{color:var(--accent);letter-spacing:2px;direction:ltr}
.checklist.red li::before{content:"✕ ";color:var(--bad);font-weight:700}
.checklist.green li::before{content:"✓ ";color:var(--good);font-weight:700}
.prompt{display:grid;gap:8px}
.prompt pre{margin:0;white-space:pre-wrap;font-family:var(--f-body);font-size:.92rem;line-height:1.6;border:1px dashed var(--accent);border-radius:6px;padding:12px;background:color-mix(in srgb,var(--accent) 5%,transparent)}
.prompt .copy{justify-self:start}
.paperc{display:grid;gap:6px;border:1px solid var(--line);border-radius:6px;padding:14px;background:color-mix(in srgb,var(--hl) 8%,transparent)}
.paperc b{font-family:var(--f-display);font-size:1.2rem}
.paperc .claim{font-weight:600;border-inline-start:4px solid var(--hl);padding-inline-start:10px}
.qcard{font-size:1.05rem;line-height:1.6}
.fig{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.fig .s-zero{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
.fig .s-ci{stroke:var(--ink);stroke-width:2}
.fig .s-dot,.fig .s-sq{fill:var(--accent)}
.fig .s-dia{fill:var(--hl);stroke:var(--ink);stroke-width:1}
.fig .s-dash{stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.fig .s-miss{fill:none;stroke:var(--bad);stroke-width:1.5;stroke-dasharray:4 3}
.fig .s-t{fill:var(--ink);font:600 12px var(--f-mono)}
.fig .s-m{fill:var(--muted);font:12px var(--f-body)}
.unlock{justify-self:center}
@media (max-width:480px){.three{grid-template-columns:1fr}}
.actions .btn{white-space:nowrap}
@media (max-width:480px){.actions .spacer{display:none}.actions{gap:8px}}
.checklist.recap li{display:grid;grid-template-columns:22px 1fr;gap:6px}
.checklist.recap li::before{content:"✓";color:var(--accent);font-weight:700}
.speakR{justify-self:start}
.nav{display:flex;gap:6px;align-items:center}
.btn.back{padding:8px 12px;min-height:40px;font-size:.85rem;font-weight:500;color:var(--muted)}
@media (max-width:480px){.actions .nav{flex:1}.actions .nav .primary{flex:1}.actions .spacer{display:block}.actions .btn{padding-inline:12px}}
.after-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:grid;gap:6px;text-align:start;border:1.5px solid var(--line);border-radius:8px;padding:14px;background:var(--sheet);align-content:start}
.tile b{font-family:var(--f-display);font-size:1.2rem}
.tile span{color:var(--muted);font-size:.92rem}
.tile em{font-style:normal;font-size:.82rem;color:var(--accent);font-weight:600}
.tile:hover:not(:disabled){border-color:var(--accent)}
.after.locked .tile{opacity:.5;cursor:default}
.pill.hot{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.paperbtn{grid-template-columns:auto 1fr auto}
.paperbtn small.en{font-size:.78rem;text-align:start}
.dots-d{color:var(--accent);letter-spacing:2px;font-size:.8rem}
.links a{text-decoration:none;color:var(--ink)}
@media (max-width:480px){.after-grid{grid-template-columns:1fr}}
</style>

</head>
<body>
<div id="app" dir="rtl" lang="he"></div>

<script>
const SECTIONS=['Abstract','Introduction','Methods','Results','Discussion','Funding/COI'];
const DESIGNS=['Case report/series','Cross-sectional','Case-control','Cohort','RCT','Meta-analysis'];
const BIASES=['Selection bias','Confounding','Unblinding','Attrition','Regression to the mean','Selective reporting'];
const CERTAINTY=['גבוהה','בינונית','נמוכה','נמוכה מאוד'];

const SVG_CI=`<svg class="fig" viewBox="0 0 320 135" role="img" aria-label="שלושה רווחי סמך מול קו אין השפעה">
<line class="s-zero" x1="76" y1="12" x2="76" y2="112"/>
<line class="s-ci" x1="132" y1="30" x2="244" y2="30"/><circle class="s-dot" cx="188" cy="30" r="5"/><text class="s-t" x="306" y="34">A</text>
<line class="s-ci" x1="48" y1="65" x2="216" y2="65"/><circle class="s-dot" cx="132" cy="65" r="5"/><text class="s-t" x="306" y="69">B</text>
<line class="s-ci" x1="84" y1="100" x2="104" y2="100"/><circle class="s-dot" cx="94" cy="100" r="5"/><text class="s-t" x="306" y="104">C</text>
<text class="s-m" x="76" y="128" text-anchor="middle">0 = אין השפעה</text>
<text class="s-m" x="250" y="128" text-anchor="middle">תועלת גדולה יותר</text>
</svg>`;

const SVG_FOREST=`<svg class="fig" viewBox="0 0 320 185" role="img" aria-label="forest plot של חמישה מחקרים ותוצאה מאוחדת">
<line class="s-zero" x1="206.7" y1="10" x2="206.7" y2="162"/>
<line class="s-ci" x1="57.3" y1="25" x2="206.7" y2="25"/><rect class="s-sq" x="128" y="21" width="8" height="8"/>
<line class="s-ci" x1="122.7" y1="50" x2="197.3" y2="50"/><rect class="s-sq" x="153" y="43" width="14" height="14"/>
<line class="s-ci" x1="113.3" y1="75" x2="262.7" y2="75"/><rect class="s-sq" x="184" y="71" width="8" height="8"/>
<line class="s-ci" x1="94.7" y1="100" x2="188" y2="100"/><rect class="s-sq" x="136.3" y="95" width="10" height="10"/>
<line class="s-ci" x1="141.3" y1="125" x2="290.7" y2="125"/><rect class="s-sq" x="212" y="121" width="8" height="8"/>
<polygon class="s-dia" points="139.5,150 161.9,143 184.3,150 161.9,157"/>
<text class="s-t" x="10" y="29">1</text><text class="s-t" x="10" y="54">2</text><text class="s-t" x="10" y="79">3</text><text class="s-t" x="10" y="104">4</text><text class="s-t" x="10" y="129">5</text><text class="s-t" x="10" y="154">Σ</text>
<text class="s-m" x="110" y="178" text-anchor="middle">לטובת התרופה</text>
<text class="s-m" x="262" y="178" text-anchor="middle">לטובת פלצבו</text>
</svg>`;

const SVG_FUNNEL=`<svg class="fig" viewBox="0 0 320 165" role="img" aria-label="funnel plot אסימטרי">
<line class="s-dash" x1="160" y1="12" x2="40" y2="140"/><line class="s-dash" x1="160" y1="12" x2="280" y2="140"/>
<line class="s-zero" x1="160" y1="12" x2="160" y2="140"/>
<circle class="s-dot" cx="158" cy="24" r="4.5"/><circle class="s-dot" cx="148" cy="40" r="4.5"/><circle class="s-dot" cx="170" cy="46" r="4.5"/>
<circle class="s-dot" cx="138" cy="64" r="4.5"/><circle class="s-dot" cx="164" cy="70" r="4.5"/><circle class="s-dot" cx="118" cy="94" r="4.5"/>
<circle class="s-dot" cx="146" cy="100" r="4.5"/><circle class="s-dot" cx="92" cy="120" r="4.5"/><circle class="s-dot" cx="110" cy="130" r="4.5"/><circle class="s-dot" cx="70" cy="134" r="4.5"/>
<circle class="s-miss" cx="225" cy="115" r="24"/><text class="s-t" x="225" y="120" text-anchor="middle">?</text>
<text class="s-m" x="160" y="158" text-anchor="middle">מחקרים קטנים ושליליים חסרים בצד ימין</text>
</svg>`;

const PROMPT_SEARCH=`חפש לי ב-PubMed סקירות שיטתיות ו-RCTs מ-5 השנים האחרונות על:
[טיפול] ב-[מצב קליני] אצל [אוכלוסייה].
לכל מאמר תן: כותרת, שנה, כתב עת, PMID או DOI, סוג המחקר, מספר משתתפים,
התוצאה הראשית עם גודל השפעה ורווח סמך, ומגבלה מרכזית אחת.
סדר לפי עוצמת הראיות. אל תמציא מקורות: אם אינך בטוח שמאמר קיים, כתוב זאת.`;

const PROMPT_APPRAISE=`נתח את המאמר המצורף לפי 5 השאלות:
1. מה שאלו (PICO)?
2. איזה סוג מחקר, והאם הוא מתאים לשאלה?

 {s:'The primary outcome was change from baseline to week 8 in MADRS total score, assessed by raters blinded to treatment allocation.',he:'המדד הראשי היה השינוי בציון MADRS משבוע 0 עד שבוע 8, שנמדד בידי מעריכים שלא ידעו מי קיבל מה.',a:2,ex:'הגדרת המדד הראשי ומי עשה את ההערכה. Methods.'}
]},

{n:2,name:'פירמידת הראיות',sub:'איזה סוג מחקר זה, וכמה הוא שווה',
steps:[

  visual:'<div class="pyramid"><div style="width:34%"><b>Systematic review</b>מטא-אנליזה</div><div style="width:46%"><b>RCT</b>ניסוי אקראי מבוקר</div><div style="width:58%"><b>Cohort</b>מחקר עוקבה</div><div style="width:70%"><b>Case-control</b>מקרה-ביקורת</div><div style="width:82%"><b>Cross-sectional</b>מחקר חתך</div><div style="width:94%"><b>Case report / series</b>תיאורי מקרה</div><div style="width:100%"><b>Expert opinion</b>דעת מומחה</div></div>',

 {t:'q',q:'איזה סוג מחקר נמצא בדרך כלל הכי גבוה בפירמידה?',

  ex:'סקירה שיטתית של כמה ניסויים טובים מאחדת יותר מידע ומפחיתה את השפעת המקרה. אבל היא טובה רק כמו המחקרים שבתוכה.'},
 {t:'card',title:'תיאור מקרה',term:'Case report · Case series',

  visual:'<div class="example"><span class="tag">דוגמה אמיתית</span>פינלנד, 1975: דווח על מקבץ מקרים של אגרנולוציטוזיס, חלקם קטלניים, אצל מטופלים שקיבלו <span class="en">clozapine</span>. התרופה הוסרה מהשוק במדינות רבות, וחזרה רק שנים אחר כך, עם ניטור ספירת דם קבוע.</div>',
  take:'תיאור מקרה מעלה השערה. הוא לא מוכיח אותה.'},
 {t:'card',title:'מחקר חתך: צילום רגע',term:'Cross-sectional study',
  body:'<p>בודקים קבוצה בנקודת זמן אחת: מי חשוף ומי חולה. מצוין לשאלות של שכיחות (<span class="en">prevalence</span>). חלש בשאלות של סיבה, כי לא יודעים מה קרה קודם.</p>',
  visual:'<div class="example"><span class="tag">דוגמה</span>סקר: בני נוער שמשתמשים ברשתות חברתיות יותר מ-3 שעות ביום מדווחים על יותר תסמיני דיכאון. האם הרשתות גורמות לדיכאון? או שבני נוער מדוכאים מבלים יותר ברשתות?</div>',
  take:'השאלה "מה קדם למה" נקראת reverse causation. נפגוש אותה שוב.'},
 {t:'q',q:'מחקר חתך מצא שאנשים עם חרדה שותים יותר קפה. מה הבעיה העיקרית במסקנה "קפה גורם לחרדה"?',
  opts:['המדגם קטן מדי','לא ידוע מה קדם למה, ויכולים להיות גורמים משותפים אחרים','קפה לא נמדד כראוי','אין בעיה, זה קשר ברור'],a:1,
  ex:'במחקר חתך אין ציר זמן. אולי אנשים חרדים ישנים פחות ושותים יותר קפה. אולי מתח בעבודה מעלה גם חרדה וגם צריכת קפה.'},
 {t:'card',title:'מקרה-ביקורת: מהתוצאה אחורה',term:'Case-control study',
  body:'<p>מתחילים מאנשים שכבר חולים (<span class="en">cases</span>) ומשווים לאנשים דומים שאינם חולים (<span class="en">controls</span>). שואלים: למי הייתה יותר חשיפה בעבר?</p><p>מתאים מאוד למחלות נדירות. החולשה: זיכרון. חולים נוטים לחפש ולזכור חשיפות יותר מבריאים (<span class="en">recall bias</span>).</p>',
  visual:'<div class="example"><span class="tag">דוגמה אמיתית</span>מחקר EU-GEI (פורסם ב-Lancet Psychiatry, 2019): מטופלים באפיזודה פסיכוטית ראשונה הושוו לאנשים מהאוכלוסייה הכללית, בכמה ערים באירופה. שימוש יומי בקנאביס חזק היה נפוץ הרבה יותר בקבוצת המטופלים.</div>',
  take:'מחקר מקרה-ביקורת מודד odds ratio. נלמד אותו ברמה 4.'},
 {t:'card',title:'מחקר עוקבה: קדימה בזמן',term:'Cohort study',

  visual:'<div class="example"><span class="tag">דוגמה אמיתית</span>מחקר שפורסם ב-Lancet ב-1987: כ-45,000 מתגייסים לצבא השוודי נשאלו על שימוש בקנאביס ונעקבו 15 שנה. ככל שהשימוש היה כבד יותר, הסיכון לסכיזופרניה היה גבוה יותר.</div>',
  take:'יחסי מינון-תגובה (dose-response), כלומר יותר חשיפה ויותר סיכון, מחזקים את הטענה לסיבתיות, אבל לא מוכיחים אותה.'},
 {t:'q',q:'רוצים לבדוק אם תרופה מסוימת בהריון קשורה למום מולד נדיר מאוד. איזה מחקר הכי מעשי?',
  opts:['RCT בנשים הרות','מחקר מקרה-ביקורת, או עוקבה גדולה ממאגרי מידע','תיאור מקרה אחד','סקר חתך בקרב רופאים'],a:1,
  ex:'RCT לבדיקת נזק בהריון אינו אתי וגם לא יגייס מספיק משתתפים לאירוע נדיר. מאגרי מידע גדולים ומחקרי מקרה-ביקורת הם הכלי המתאים.'},
 {t:'card',title:'ניסוי אקראי מבוקר: ההגרלה',term:'RCT · Randomized controlled trial',
  body:'<p>החוקרים מגרילים מי יקבל טיפול ומי ביקורת. ההגרלה יוצרת קבוצות דומות גם בגורמים שאף אחד לא חשב למדוד.</p><p>זו הסיבה המרכזית שבגללה RCT עומד מעל מחקרי תצפית בשאלות של יעילות טיפול.</p>',
  visual:'<div class="compare"><div><b>מחקר תצפית</b>הרופא בחר מי מקבל את התרופה. אולי דווקא את החולים הקשים, או את אלה שמגיעים לביקורות.</div><div><b>RCT</b>הגרלה החליטה. ההבדלים בין הקבוצות הם רק מקריים.</div></div>',
  take:'RCT מצוין לשאלות יעילות. אבל הוא לרוב קצר, קטן מדי לנזקים נדירים, ומוציא מטופלים "מסובכים".'},
 {t:'card',title:'סקירה שיטתית ומטא-אנליזה',term:'Systematic review · Meta-analysis',
  body:'<p>סקירה שיטתית מחפשת את כל המחקרים על שאלה מסוימת, לפי שיטה שהוגדרה מראש. מטא-אנליזה מאחדת את המספרים שלהם לתוצאה אחת.</p>',
  visual:'<div class="example"><span class="tag">דוגמה אמיתית</span>Cipriani ושותפיו, Lancet 2018: מטא-אנליזת רשת של 522 ניסויים עם 116,477 משתתפים. כל 21 נוגדי הדיכאון שנבדקו היו יעילים יותר מפלצבו בטיפול חריף במבוגרים, בהבדלים צנועים.</div>',
  take:'Garbage in, garbage out: מטא-אנליזה של מחקרים מוטים תיתן תוצאה מוטה, רק בביטחון רב יותר.'},
 {t:'q',q:'מטא-אנליזה איחדה 15 מחקרים קטנים, רובם בלי סמיות. מה נכון?',

 {t:'card',title:'איזה מחקר לאיזו שאלה',term:'Study design ↔ question',

  visual:'<ul class="checklist"><li><b>יעילות טיפול</b> · RCT, וסקירה שיטתית של RCTs</li><li><b>נזק נדיר או מאוחר</b> · עוקבה גדולה, מקרה-ביקורת</li><li><b>פרוגנוזה</b> · מחקר עוקבה</li><li><b>שכיחות</b> · מחקר חתך</li><li><b>דיוק של כלי אבחון</b> · מחקר חתך מול "תקן זהב"</li><li><b>תופעה חדשה</b> · תיאורי מקרה</li></ul>',

 {t:'q',q:'רוצים לדעת מה הסיכוי של מטופל אחרי אפיזודה פסיכוטית ראשונה לחזור לעבודה תוך 5 שנים. איזה מחקר?',
  opts:['RCT','מחקר עוקבה','מחקר מקרה-ביקורת','תיאור מקרה'],a:1,

],

/* ---------- LEVEL 3 ---------- */
{n:3,name:'מה יכול להטעות',sub:'הטיות קלאסיות, עם דוגמאות מפסיכיאטריה',
steps:[
 {t:'card',title:'שלושה הסברים חלופיים',term:'Chance · Bias · Confounding',
  body:'<p>לפני שמאמינים שטיפול עבד, או שחשיפה גרמה למחלה, שוללים שלושה הסברים:</p>',
  visual:'<div class="three"><div><b>מקרה</b><span class="en">Chance</span>המדגם קטן, והתוצאה יצאה במזל.</div><div><b>הטיה</b><span class="en">Bias</span>טעות שיטתית בתכנון, במדידה או בניתוח.</div><div><b>ערפלן</b><span class="en">Confounding</span>גורם שלישי שמסביר את הקשר.</div></div>',
  take:'ברמה הזו נלמד לזהות הטיות וערפלנים. במקרה נטפל ברמה 4.'},
 {t:'card',title:'הטיית בחירה',term:'Selection bias',
  body:'<p>מי שנכנס למחקר שונה ממי שאתה מטפל בו, או שהקבוצות שונות זו מזו כבר מההתחלה.</p>',
  visual:'<div class="example"><span class="tag">דוגמה נפוצה</span>ניסוי בנוגד דיכאון שמוציא מטופלים עם אובדנות, שימוש בחומרים ותחלואה גופנית. נשארים מטופלים "נקיים", שלרוב מגיבים טוב יותר. במרפאה שלך המטופלים נראים אחרת.</div>',
  take:'שאל: האם המשתתפים דומים למטופל שיושב מולי? (המונח: external validity.)'},
 {t:'card',title:'ערפלן',term:'Confounding',
  body:'<p>גורם שלישי שקשור גם לחשיפה וגם לתוצאה, ויוצר קשר שנראה סיבתי.</p>',
  visual:'<div class="example"><span class="tag">דוגמה אמיתית</span>מחקרי תצפית מצאו קשר בין נטילת SSRI בהריון לבין אוטיזם בילד. אבל נשים שנוטלות SSRI הן נשים עם דיכאון וחרדה, ויש להן רקע גנטי וסביבתי שונה. במחקרים שהשוו בין אחים, הקשר נחלש מאוד. לזה קוראים <span class="en">confounding by indication</span>.</div>',
  take:'בכל מחקר תצפיתי שאל: מה עוד שונה בין הקבוצות?'},
 {t:'q',q:'מחקר תצפיתי: אנשים שעושים פעילות גופנית סובלים פחות מדיכאון. מה ההסבר החלופי?',
  opts:['אין הסבר חלופי, פעילות גופנית מונעת דיכאון','אנשים מדוכאים זזים פחות, ואנשים בריאים יותר גם זזים יותר וגם פחות מדוכאים','המחקר בהכרח קטן מדי','זו הטיית פרסום'],a:1,
  ex:'גם reverse causation (הדיכאון מוריד פעילות) וגם ערפלנים (בריאות כללית, הכנסה, תמיכה חברתית). כדי לבדוק סיבתיות צריך RCT, ואכן יש ניסויים כאלה.'},
 {t:'card',title:'סמיות וציפייה',term:'Blinding · Placebo response',
  body:'<p>בפסיכיאטריה התוצאה היא לרוב דירוג של תסמינים. אם המטופל או המעריך יודעים מה ניתן, הציפייה משנה את הדירוג. תגובת הפלצבו בניסויי דיכאון גבוהה מאוד.</p><p><b>Functional unblinding:</b> כשלטיפול יש תחושה ברורה, כמו קטמין, פסילוסיבין או תופעות לוואי בולטות, המשתתפים מנחשים באיזו קבוצה הם, גם בניסוי "כפול סמיות".</p>',
  visual:'',
  take:'שאל: האם המשתתפים יכלו לנחש? מאמרים טובים בודקים את זה ומדווחים.'},
 {t:'q',q:'בניסוי פסילוסיבין מול פלצבו, רוב המשתתפים ניחשו נכון את הקבוצה שלהם. מה המשמעות?',
  opts:['אין משמעות, הניסוי היה כפול סמיות','הסמיות נשברה, וחלק מההבדל עלול לנבוע מציפייה','הפסילוסיבין בהכרח לא עובד','צריך פשוט מדגם גדול יותר'],a:1,
  ex:'כשהסמיות נשברת, הציפייה של המשתתף ושל המעריך נכנסת לתוצאה, במיוחד בשאלונים. מדגם גדול יותר לא פותר את זה.'},
 {t:'card',title:'נשירה ו-ITT',term:'Attrition · Intention-to-treat',
  body:'<p><b>Intention-to-treat (ITT):</b> מנתחים כל משתתף בקבוצה שאליה הוגרל, גם אם הפסיק את הטיפול. זה שומר על היתרון של ההגרלה.</p><p><b>Per-protocol:</b> מנתחים רק את מי שהשלים. זה נשמע הגיוני, אבל מי שהשלים הוא לרוב מי שהרגיש טוב יותר.</p>',
  visual:'',
  take:'בניסויי יעילות, ITT הוא ברירת המחדל הנכונה. ניתוח per-protocol בלבד הוא דגל צהוב.'},
 {t:'q',q:'ניסוי מדווח רק ניתוח per-protocol, ו-30% נשרו מקבוצת התרופה. מה החשש?',
  opts:['אין חשש','התוצאה עלולה להיות טובה מהמציאות, כי מי שסבל מתופעות לוואי או לא השתפר עזב','התוצאה בהכרח גרועה מהמציאות','זו בעיה רק אם המדגם קטן'],a:1,
  ex:'מי שנשאר בקבוצת התרופה הוא קבוצה "מסוננת". ההשוואה כבר לא בין קבוצות מוגרלות.'},
 {t:'card',title:'רגרסיה לממוצע',term:'Regression to the mean',
  body:'<p>מטופלים מגיעים לטיפול, וגם למחקר, כשהם בשיא הקושי. גם בלי שום טיפול חלק ישתפרו ויחזרו לממוצע שלהם.</p><p>לכן מחקר בלי קבוצת ביקורת יראה כמעט תמיד "שיפור".</p>',
  visual:'',
  take:'"80% השתפרו" בלי קבוצת ביקורת לא אומר כמעט כלום.'},
 {t:'q',q:'מחקר פתוח בלי קבוצת ביקורת: 70% מהמטופלים השתפרו אחרי חודש של טיפול חדש. מה נכון?',
  opts:['הטיפול יעיל ב-70%','השיפור יכול לנבוע מרגרסיה לממוצע, מהמהלך הטבעי ומפלצבו. צריך קבוצת ביקורת','70% זה מעט מדי','זו הוכחה ברמה של RCT'],a:1,
  ex:'בלי קבוצת ביקורת אין דרך להפריד את השפעת הטיפול מכל מה שקורה ממילא.'},
 {t:'card',title:'דיווח סלקטיבי',term:'Selective reporting · Outcome switching',
  body:'<p>החוקרים מודדים הרבה דברים, ומבליטים את מה שיצא טוב.</p>',
  visual:'<div class="example"><span class="tag">דוגמה אמיתית</span>Study 329 (פורסם ב-2001): ניסוי של פרוקסטין במתבגרים עם דיכאון. המאמר המקורי הציג את התרופה כיעילה ובטוחה, אף שהמדדים הראשיים שהוגדרו מראש לא הראו הבדל מובהק. ניתוח מחדש של הנתונים, שפורסם ב-BMJ ב-2015, מצא שהתרופה לא הייתה יעילה וגרמה ליותר נזקים, כולל אירועים אובדניים.</div>',
  take:'השווה את המדד הראשי במאמר לזה שברישום (ClinicalTrials.gov). אם הם שונים, זה דגל אדום.'},
 {t:'card',title:'ספין ותת-קבוצות',term:'Spin · Subgroup analysis',
  body:'<p>מילים כמו "trend toward significance" או "may be beneficial" מנסות להפוך תוצאה שלילית לחיובית.</p><p><b>תת-קבוצות:</b> אם בודקים 20 תת-קבוצות, סביר שאחת "תצא מובהקת" במקרה. תוצאה בתת-קבוצה היא השערה לבדיקה, לא ממצא.</p>',
  visual:'',
  take:'כשהמדד הראשי נכשל, כל השאר הוא השערה.'},
 {t:'q',q:'המדד הראשי לא הראה הבדל, אבל המאמר מדגיש תוצאה מובהקת אצל נשים מעל גיל 50. איך מתייחסים לזה?',
  opts:['ממליצים על התרופה לנשים מעל 50','זו השערה שדורשת ניסוי חדש, כי תת-קבוצות יוצאות מובהקות במקרה','מתעלמים מכל המאמר','זה מוכיח שהתרופה עובדת'],a:1,
  ex:'ממצא בתת-קבוצה, במיוחד כזה שלא הוגדר מראש, הוא סיבה לניסוי הבא ולא לשינוי בטיפול.'}
],

 {s:'ניסוי של חודש לטיפול בדיכאון: 35% נשרו מקבוצת התרופה בגלל תופעות לוואי, והניתוח כלל רק את מי שסיים.',a:3,ex:'נשירה גבוהה וניתוח של המשלימים בלבד. ITT היה מגלה תמונה אחרת.'},
 {s:'מחקר בלי קבוצת ביקורת: מטופלים שהגיעו למיון בשיא חרדה קיבלו תוסף צמחי, ואחרי שבועיים 75% השתפרו.',a:4,ex:'מגיעים בשיא, וחוזרים לממוצע. בלי ביקורת אין דרך לדעת אם התוסף עשה משהו.'},

/* ---------- LEVEL 4 ---------- */
{n:4,name:'מספרים בלי פחד',sub:'p-value, CI, NNT ו-effect size מאפס',
steps:[
 {t:'card',title:'למה צריך סטטיסטיקה',term:'Statistics in two questions',
  body:'<p>כל מחקר בודק מדגם, לא את כל האנשים. הסטטיסטיקה עונה על שתי שאלות:</p>',
  visual:'<div class="compare"><div><b>האם זה מקרי?</b>p-value ורווח סמך</div><div><b>כמה זה גדול?</b>הפרש, NNT, גודל אפקט</div></div>',
  take:'השאלה השנייה חשובה יותר לקליניקה, והיא זו שהכי הרבה אנשים מדלגים עליה.'},
 {t:'card',title:'p-value בשפה פשוטה',term:'p-value',
  body:'<p>נניח שהתרופה לא עושה כלום. מה הסיכוי לראות, במקרה, הבדל גדול כמו שראינו או גדול יותר? זה ה-p-value.</p><p>p של 0.03 אומר: אם אין שום השפעה, תוצאה כזו תופיע במקרה בערך ב-3 מכל 100 ניסויים.</p>',
  visual:'<div class="example"><span class="tag">אינטואיציה</span>מטבע נפל על "עץ" 9 פעמים מתוך 10. אם המטבע הוגן, זה נדיר מאוד, ולכן חושדים שהוא לא הוגן. זה כל הרעיון.</div>',
  take:'p קטן לא אומר שההשפעה גדולה או חשובה. הוא רק אומר שקשה להסביר את התוצאה במקרה. הסף 0.05 הוא מוסכמה, לא חוק טבע.'},
 {t:'q',q:'ניסוי עם 10,000 משתתפים: הבדל של נקודה אחת ב-HAM-D, ו-p של 0.001. מה נכון?',
  opts:['התרופה מאוד יעילה','ההבדל כנראה אמיתי, אבל קטן מכדי שמטופל ירגיש אותו','התוצאה מקרית','p קטן אומר אפקט גדול'],a:1,
  ex:'במדגם ענק גם הבדל זעיר יוצא מובהק. מובהקות סטטיסטית אינה משמעות קלינית.'},
 {t:'card',title:'רווח סמך',term:'95% Confidence interval',
  body:'<p>רווח סמך של 95% הוא טווח הערכים הסבירים להשפעה האמיתית. הוא אומר שני דברים בבת אחת: האם זה מקרי, וכמה זה גדול.</p>',
  visual:SVG_CI+'<ul class="checklist"><li><b>A</b> · לא נוגע ב-0: מובהק, והשפעה ברורה.</li><li><b>B</b> · חוצה את 0: לא מובהק. ההשפעה יכולה להיות גם אפס. הטווח רחב, כלומר מעט מידע.</li><li><b>C</b> · לא נוגע ב-0 וצר: מובהק, אבל ההשפעה זעירה.</li></ul>',
  take:'קו "אין השפעה" הוא 0 בהפרשים, ו-1 ביחסים (RR, OR).'},
 {t:'q',q:'הפרש ב-MADRS לטובת התרופה: 2.3 נקודות, ורווח הסמך בין 0.5 ל-4.1. מה נכון?',
  opts:['לא מובהק','מובהק, כי הרווח לא כולל 0. ההשפעה האמיתית יכולה להיות בין זעירה לבינונית','ההשפעה היא בדיוק 2.3','זה אומר ש-95% מהמטופלים ישתפרו'],a:1,
  ex:'רווח הסמך לא כולל 0, לכן מובהק. אבל הקצה התחתון, חצי נקודה, הוא חסר משמעות קלינית. זה מידע שה-p-value לבד לא נותן.'},
 {t:'card',title:'סיכון יחסי מול מוחלט',term:'Relative vs absolute risk',
  body:'<p>הישנות של דיכאון בתוך שנה: 20% בפלצבו, 10% בתרופה.</p>',
  visual:'<div class="compare"><div><b>הפחתה יחסית</b><span class="bignum">50%</span>"הסיכון ירד בחצי!"</div><div><b>הפחתה מוחלטת</b><span class="bignum">10%</span>מ-20 ל-10 מכל 100 מטופלים</div></div>',
  take:'כותרות ופרסומות אוהבות סיכון יחסי. החלטות קליניות צריכות סיכון מוחלט.'},
 {t:'card',title:'NNT ו-NNH',term:'Number needed to treat / harm',
  body:'<p>NNT = 1 חלקי ההפחתה המוחלטת בסיכון. בדוגמה: 1 חלקי 0.10 = 10. צריך לטפל ב-10 מטופלים כדי למנוע הישנות אחת.</p><p>NNH הוא אותו חישוב, לתופעת לוואי.</p>',
  visual:'<div class="people" aria-label="10 מטופלים, אחד מהם נהנה מהטיפול"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="on"></i></div><p class="note">מתוך 10 מטופלים שקיבלו את התרופה, אחד לא חזר לדיכאון בזכותה.</p>',
  take:'בפסיכיאטריה, NNT בטווח של 5 עד 10 נחשב לרוב סביר. תמיד שוקלים אותו מול NNH ומול רצון המטופל.'},
 {t:'q',q:'תגובה לטיפול: 50% בתרופה, 40% בפלצבו. מה ה-NNT?',
  opts:['2','5','10','40'],a:2,
  ex:'ההפרש המוחלט: 10 נקודות אחוז, כלומר 0.10. אחד חלקי 0.10 = 10.'},
 {t:'q',q:'עלייה במשקל של יותר מ-7%: אצל 30% בתרופה ו-10% בפלצבו. מה ה-NNH?',
  opts:['3','5','10','20'],a:1,
  ex:'ההפרש: 20 נקודות אחוז, כלומר 0.20. אחד חלקי 0.20 = 5. על כל 5 מטופלים, אחד יעלה במשקל בגלל התרופה.'},
 {t:'card',title:'גודל אפקט',term:'Effect size · SMD',
  body:'<p>כשכל מחקר משתמש בסולם אחר, ממירים את ההבדל ליחידה משותפת: כמה סטיות תקן מפרידות בין הקבוצות.</p>',
  visual:'<div class="scale"><span style="inset-inline-start:20%">0.2<br>קטן</span><span style="inset-inline-start:50%">0.5<br>בינוני</span><span style="inset-inline-start:80%">0.8<br>גדול</span><span class="mark" style="inset-inline-start:30%">נוגדי דיכאון מול פלצבו: בסביבות 0.3</span></div>',
  take:'אפקט ממוצע קטן יכול להסתיר מטופלים שמגיבים מאוד לצד מטופלים שלא מגיבים בכלל.'},
 {t:'card',title:'Odds ratio ו-Risk ratio',term:'OR · RR',
  body:'<p>שתי דרכים לבטא יחס בין סיכונים בשתי קבוצות.</p><p>1 = אין הבדל. מעל 1 = יותר סיכון בקבוצה החשופה. מתחת ל-1 = פחות סיכון.</p><p>כשהתוצאה נדירה, השניים כמעט זהים. כשהיא שכיחה, OR נראה דרמטי יותר מ-RR.</p>',

steps:[

  visual:'<div class="pyramid"><div style="width:46%"><b>Guidelines</b>הנחיות: NICE, APA, CANMAT</div><div style="width:64%"><b>Point-of-care</b>UpToDate, DynaMed</div><div style="width:82%"><b>Systematic reviews</b>Cochrane, Epistemonikos</div><div style="width:100%"><b>Single studies</b>PubMed</div></div>',
  take:'הנחיה טובה כבר עשתה בשבילך את העבודה של רמות 2 עד 6.'},
 {t:'card',title:'PubMed בחוכמה',term:'PubMed',
  body:'<p>כמה טריקים שחוסכים הרבה זמן:</p>',
  visual:'<ul class="checklist"><li><b>סינון לפי סוג מאמר:</b> בצד המסך, Article type, לבחור Randomized Controlled Trial או Systematic Review.</li><li><b>מונחי MeSH:</b> מילות מפתח קבועות שתופסות גם מאמרים עם ניסוח שונה.</li><li><b>Similar articles:</b> מצאת מאמר טוב? הקישור הזה מוצא את קרוביו.</li><li><b>מיון לפי תאריך:</b> כדי לראות קודם את החדשים.</li></ul><div class="paper">depression[mh] AND ketamine AND randomized controlled trial[pt]</div>',
  take:'שלושה רכיבים: מה הבעיה, מה הטיפול, ואיזה סוג מחקר.'},
 {t:'card',title:'מקורות נוספים שכדאי להכיר',term:'Beyond PubMed',
  body:'',
  visual:'<ul class="checklist"><li><b>Cochrane Library</b> · סקירות שיטתיות עם טבלאות GRADE.</li><li><b>Epistemonikos</b> · מאגר ענק של סקירות שיטתיות.</li><li><b>ClinicalTrials.gov</b> · לבדוק רישום מראש ומדד ראשי מקורי.</li><li><b>Retraction Watch</b> · לבדוק אם מאמר נשלף.</li><li><b>medRxiv</b> · מאמרים לפני ביקורת עמיתים (preprints). מעניין, אבל עוד לא נבדק.</li></ul>',

 {t:'q',q:'קראת כותרת "תרופה חדשה מרפאת דיכאון תוך יום". המקור הוא medRxiv. מה המשמעות?',
  opts:['המאמר עבר ביקורת עמיתים','זה preprint שעוד לא עבר ביקורת עמיתים. מתייחסים אליו כהשערה','זה מאמר שנשלף','זו הנחיה קלינית'],a:1,
  ex:'medRxiv הוא שרת preprints. הממצא יכול להיות נכון, אבל עוד לא נבדק.'},
 {t:'card',title:'כתבי עת טורפניים',term:'Predatory journals',

  visual:'<ul class="checklist red"><li>הזמנה במייל לפרסם "תוך 7 ימים"</li><li>דמי פרסום גבוהים, בלי ביקורת אמיתית</li><li>לא מופיע ב-MEDLINE</li><li>שם שדומה מאוד לכתב עת מוכר</li></ul>',
  take:'וגם ההפך: impact factor גבוה לא מבטיח שמאמר מסוים אמין. Wakefield פורסם ב-Lancet.'},
 {t:'card',title:'מה לבקש ממני כשאתה מחפש מאמרים',term:'Prompt: find evidence',

 {q:'מה החוזק הגדול של STAR*D?',opts:['פלצבו מבוקר','אוכלוסייה רחבה ומייצגת של מטופלי חוץ, קרובה למרפאה האמיתית','מדגם קטן ונקי','משך קצר'],a:1,ex:'תוקף חיצוני גבוה. החולשה היא בתוקף הפנימי.'}
 ]},
{id:'catie',tag:'קלאסי',d:2,title:'CATIE: אנטי-פסיכוטיים בסכיזופרניה כרונית',cite:'Lieberman JA et al. N Engl J Med 2005;353:1209-1223',pmid:'16172203',doi:'10.1056/NEJMoa051688',
 design:'RCT כפול סמיות, פרגמטי, 1,493 מטופלים ב-57 אתרים, עד 18 חודשים',
 why:'הניסוי שערער את ההנחה שתרופות הדור השני עדיפות בבירור על הדור הראשון.',
 look:['מה המדד הראשי, ולמה הוא שונה מניסוי רגיל?','כמה הפסיקו את התרופה?','מה המחיר של התרופה שיצאה הכי טובה?'],
 qs:[
 {q:'מה היה המדד הראשי?',opts:['שינוי ב-PANSS','הזמן עד הפסקת התרופה מכל סיבה','משקל','אשפוזים'],a:1,ex:'מדד "effectiveness": משלב יעילות, סבילות והעדפת מטופל ורופא. מתאים לשאלה המעשית.'},
 {q:'74% הפסיקו את התרופה שהוקצתה לפני 18 חודשים. מה זה מלמד?',opts:['שהמחקר נכשל','שבמציאות רוב המטופלים לא מתמידים באותה תרופה, בגלל חוסר יעילות, תופעות לוואי או סיבות אחרות','שהתרופות לא עובדות','שהמדגם לא מייצג'],a:1,ex:'זה ממצא קליני חשוב בפני עצמו, לא רק בעיה מתודולוגית.'},
 {q:'מה היה הממצא המפתיע לגבי perphenazine, תרופת דור ראשון?',opts:['שהיא הכי גרועה','שיעילותה נראתה דומה ל-quetiapine, risperidone ו-ziprasidone','שגרמה הכי הרבה עלייה במשקל','שלא נכללה'],a:1,ex:'זה הוביל לדיון מחודש על עלות-תועלת של תרופות הדור השני.'},
 {q:'olanzapine יצאה הכי טובה במדד הראשי. מה המחיר?',opts:['יותר תופעות אקסטרה-פירמידליות','יותר עלייה במשקל ושינויים בגלוקוז ובשומנים','יותר אובדנות','אין מחיר'],a:1,ex:'דוגמה קלאסית לשקילת NNT מול NNH. הבחירה תלויה במטופל.'},
 {q:'למה מכנים ניסוי כזה "פרגמטי"?',opts:['כי הוא קטן','כי הוא בודק טיפולים בתנאים קרובים למציאות: אתרים רבים, מטופלים מגוונים, משך ארוך ומדד מעשי','כי אין בו הגרלה','כי אין בו סמיות'],a:1,ex:'ניסוי פרגמטי עונה על "מה עובד בשגרה", ולא רק על "האם זה יכול לעבוד בתנאים אידיאליים".'}
 ]},
{id:'study329',tag:'קלאסי',d:2,title:'שחזור Study 329: פרוקסטין במתבגרים',cite:'Le Noury J et al. BMJ 2015;351:h4320',pmid:'26376805',doi:'10.1136/bmj.h4320',
 design:'ניתוח מחדש של RCT כפול סמיות, 275 מתבגרים, 8 שבועות',
 why:'השוואה נדירה בין מה שפורסם לבין מה שהנתונים הגולמיים הראו. שיעור מעשי בדיווח סלקטיבי.',
 look:['מה היו המדדים הראשיים שהוגדרו מראש?','כמה ירד ה-HAM-D בכל קבוצה?','איך סווגו תופעות הלוואי?'],
 qs:[
 {q:'מה זה RIAT, שבמסגרתו נעשה השחזור?',opts:['סוג של מטא-אנליזה','יוזמה לשחזר ולפרסם מחדש ניסויים מתוך הנתונים והפרוטוקולים המקוריים','שיטה סטטיסטית','כלי להערכת הטיה'],a:1,ex:'Restoring Invisible and Abandoned Trials.'},
 {q:'ה-HAM-D ירד ב-10.7 בפרוקסטין, ב-9.0 באימיפרמין וב-9.1 בפלצבו (p=0.20). מה נכון?',opts:['פרוקסטין יעיל','אין הבדל מובהק או קליני, והירידה הגדולה בפלצבו מראה כמה תגובת הפלצבו והמהלך הטבעי חזקים','אימיפרמין הכי טוב','הניסוי קטן מדי לכל מסקנה'],a:1,ex:'כ-1.6 נקודות מעל פלצבו, לא מובהק ורחוק מסף קליני.'},
 {q:'מה ההבדל המרכזי בין המאמר המקורי מ-2001 לשחזור?',opts:['השחזור השתמש בנתונים אחרים','המאמר המקורי הבליט מדדים שלא הוגדרו כראשיים, ותופעות הלוואי הוצגו באופן שהקטין את האובדנות','השחזור לא כלל פלצבו','אין הבדל'],a:1,ex:'אותם נתונים, שתי מסקנות הפוכות. הכל תלוי במה שמוגדר מראש ומה שמדווח.'},
 {q:'"לא הוגדר מראש מילון לקידוד תופעות לוואי". למה זה חשוב?',opts:['זה פרט טכני','כי הדרך שבה מסווגים אירוע, למשל אובדנות כ"חוסר יציבות רגשית", קובעת מה ייראה בטבלה','זה משפיע רק על יעילות','מילונים לא חשובים'],a:1,ex:'קידוד חופשי מאפשר להחביא אותות בטיחות בתוך קטגוריות כלליות.'},
 {q:'מה הלקח שהמחברים מדגישים?',opts:['לא לרשום SSRI למתבגרים לעולם','שאין לקרוא מסקנות שפורסמו כסמכותיות, ושיש צורך בגישה לנתונים ולפרוטוקולים','שמטא-אנליזות מיותרות','שכתבי עת אמינים תמיד'],a:1,ex:'זה הלקח של כל הקורס: בודקים את השיטה והנתונים, לא את הכותרת.'}
 ]},
{id:'kirsch',tag:'קלאסי',d:3,title:'חומרה התחלתית ותועלת נוגדי דיכאון',cite:'Kirsch I et al. PLoS Med 2008;5:e45',pmid:'18303940',doi:'10.1371/journal.pmed.0050045',
 design:'מטא-אנליזה ומטא-רגרסיה של כל הניסויים שהוגשו ל-FDA לארבע תרופות',
 why:'מאמר שעורר ויכוח עצום. מצוין לתרגול של משמעות קלינית, מטא-רגרסיה ופרשנות זהירה.',
 look:['מאיפה הגיעו הנתונים, ולמה זה חשוב?','איך ההבדל בין תרופה לפלצבו משתנה עם החומרה?','מה מסביר את השינוי: התרופה או הפלצבו?'],
 qs:[
 {q:'למה השימוש בכל הניסויים שהוגשו ל-FDA הוא חוזק?',opts:['כי הם חדשים','כי הם כוללים גם ניסויים שלא פורסמו, ולכן פחות הטיית פרסום','כי הם גדולים במיוחד','כי ה-FDA ניתח אותם'],a:1,ex:'אותו רעיון כמו אצל Turner.'},
 {q:'מה הממצא המרכזי?',opts:['התרופות לא עובדות בכלל','ההבדל בין תרופה לפלצבו גדל עם חומרת הדיכאון, ועובר את סף המשמעות הקלינית רק בחומרה גבוהה מאוד','ההבדל קבוע בכל רמות החומרה','פלצבו עדיף'],a:1,ex:'בחומרה בינונית ההבדל כמעט אפסי, ובחומרה גבוהה מאוד הוא עדיין קטן יחסית.'},
 {q:'מה מסביר, לפי המחברים, את הקשר לחומרה?',opts:['תגובה חזקה יותר לתרופה אצל חולים קשים','תגובה חלשה יותר לפלצבו אצל חולים קשים','מינונים גבוהים יותר','נשירה'],a:1,ex:'פרט שקל לפספס: ההבדל גדל כי הפלצבו "עובד" פחות, לא כי התרופה עובדת יותר.'},
 {q:'הניתוח נעשה ברמת הניסוי (ממוצעים של ניסויים), לא ברמת המטופל. מה המגבלה?',opts:['אין מגבלה','קשר בין ממוצעים של ניסויים לא בהכרח מתקיים ברמת המטופל הבודד (ecological fallacy)','זה מגדיל את הדיוק','זה מונע הטיית פרסום'],a:1,ex:'מטא-רגרסיה על נתוני קבוצה היא השערה לגבי מטופלים. מחקרים מאוחרים עם נתוני מטופלים בודדים נתנו תמונה מורכבת יותר.'},
 {q:'מה עוד צריך לשאול לפני שמסיקים "נוגדי דיכאון לא עוזרים בדיכאון בינוני"?',opts:['כלום','כמה ניסויים בכלל כללו מטופלים בחומרה בינונית, כי רוב הנתונים הם מחומרה גבוהה, והאם סף המשמעות הקלינית שנבחר מוסכם','מי המחבר','באיזו שנה פורסם'],a:1,ex:'הסקה לטווח שבו יש מעט נתונים היא אקסטרפולציה. וגם הסף של "משמעות קלינית" עצמו שנוי במחלוקת.'}
 ]},
{id:'eugei',tag:'פורץ דרך',d:3,title:'קנאביס חזק ופסיכוזה באירופה (EU-GEI)',cite:'Di Forti M et al. Lancet Psychiatry 2019;6:427-436',pmid:'30902669',doi:'10.1016/S2215-0366(19)30048-3',
 design:'מחקר מקרה-ביקורת רב-מרכזי: 901 מטופלים באפיזודה ראשונה מול 1,237 ביקורות',
 why:'מחקר שהשפיע על מדיניות ציבורית. מצוין לתרגול OR מתוקנן, PAF ומתאמים אקולוגיים.',
 look:['איך נבחרה קבוצת הביקורת?','מה ה-OR לשימוש יומי ולשימוש יומי בקנאביס חזק?','על איזו הנחה נשען חישוב ה-PAF?'],
 qs:[
 {q:'שימוש יומי: OR מתוקנן של 3.2 (CI 2.2 עד 4.1). מה פירוש "מתוקנן"?',opts:['שהוא סיבתי','שהוא תוקן לגורמים שנמדדו, כמו גיל ומין. ערפלנים שלא נמדדו עדיין אפשריים','שהוא מדויק לחלוטין','שהוא RR'],a:1,ex:'תיקון סטטיסטי מטפל רק במה שנמדד ונמדד היטב. זה residual confounding.'},
 {q:'החוקרים חישבו ש-12.2% מהמקרים היו נמנעים בלי קנאביס חזק. על מה נשען המספר?',opts:['על RCT','על ההנחה שהקשר סיבתי, כפי שהם עצמם כותבים','על נתוני FDA','על סקר חתך'],a:1,ex:'"Assuming causality". PAF הוא תרחיש, לא תצפית.'},
 {q:'בין 11 האתרים נמצא מתאם (r=0.7) בין שכיחות קנאביס חזק לשיעור הפסיכוזה. איזה סוג ראיה זה?',opts:['ראיה ברמת הפרט','ראיה אקולוגית, על 11 נקודות בלבד, שחשופה לגורמים אחרים שמשתנים בין ערים','RCT','ראיה סיבתית ישירה'],a:1,ex:'מתאם בין ערים לא אומר שהאנשים שהשתמשו הם אלה שחלו. זה מחזק את התמונה, אבל לא מוכיח.'},
 {q:'השימוש בקנאביס דווח בשאלון. איזו הטיה אפשרית?',opts:['regression to the mean','recall bias: מטופלים וביקורות עשויים לזכור ולדווח באופן שונה','attrition','publication bias'],a:1,ex:'בעיה קלאסית במקרה-ביקורת.'},
 {q:'מה הדבר שהכי מחזק טענה סיבתית במחקר הזה?',opts:['גודל המדגם בלבד','יחסי מינון-תגובה: הסיכון עולה עם תדירות וחוזק, ועקביות עם מחקרי עוקבה קודמים','שפורסם ב-Lancet Psychiatry','שהמימון ציבורי'],a:1,ex:'מינון-תגובה ועקביות הם שניים מהקריטריונים הקלאסיים לסיבתיות (Bradford Hill).'}
 ]},
{id:'psilo',tag:'פורץ דרך',d:2,title:'פסילוסיבין מול אסציטלופרם',cite:'Carhart-Harris R et al. N Engl J Med 2021;384:1402-1411',pmid:'33852780',doi:'10.1056/NEJMoa2032994',
 design:'RCT שלב 2, כפול סמיות, 59 מטופלים, 6 שבועות',
 why:'מאמר שהכותרות סביבו היו חזקות בהרבה מהנתונים. מושלם לתרגול מדד ראשי מול משניים.',
 look:['מה המדד הראשי ומה יצא בו?','כמה מדדים משניים היו, והאם תוקנו?','איך שמרו על הסמיות?'],
 qs:[
 {q:'המדד הראשי: הבדל של 2.0 נקודות ב-QIDS-SR-16, CI בין 5.0 לטובת פסילוסיבין ל-0.9 לטובת אסציטלופרם, p=0.17. מה המסקנה?',opts:['פסילוסיבין עדיף','אין הבדל מובהק במדד הראשי. רווח הסמך כולל גם אפס','אסציטלופרם עדיף','הניסוי הוכיח שוויון'],a:1,ex:'וחשוב: "לא מובהק" אינו "שווים". הניסוי קטן מכדי להוכיח שוויון.'},
 {q:'רמיסיה: 57% מול 28%, CI בין 2 ל-54 נקודות אחוז. למה לא להסיק מזה שפסילוסיבין עדיף?',opts:['כי זה מספר קטן','כי זה אחד מ-16 מדדים משניים, בלי תיקון להשוואות מרובות, ורווח הסמך רחב מאוד','כי זה לא מובהק','כי רמיסיה לא חשובה'],a:1,ex:'עם 16 מדדים, כמה ייצאו מובהקים במקרה. המחברים עצמם כותבים את זה.'},
 {q:'קבוצת אסציטלופרם קיבלה גם 1 מ"ג פסילוסיבין. למה?',opts:['כדי לבדוק מינון נמוך','כדי לנסות לשמור על הסמיות, כך ששתי הקבוצות יקבלו "מנה" של החומר','בטעות','כדי להגדיל את האפקט'],a:1,ex:'ניסיון לשמר סמיות. עם חוויה פסיכדלית במינון 25 מ"ג, קשה מאוד שהמשתתפים לא ינחשו.'},
 {q:'ציון ההתחלה היה 14.5 בפסילוסיבין ו-16.4 באסציטלופרם. מה כדאי לשים לב?',opts:['אין משמעות','במדגם קטן, ההגרלה לא תמיד יוצרת קבוצות דומות, וזה יכול להשפיע על התוצאות','זה מוכיח הטיה מכוונת','זה משפר את התוקף'],a:1,ex:'זה בדיוק התפקיד של Table 1.'},
 {q:'מה רמת הוודאות הסבירה לטענה "פסילוסיבין עדיף על SSRI"?',opts:['גבוהה','בינונית','נמוכה עד נמוכה מאוד: מדד ראשי לא מובהק, מדגם קטן, סמיות בעייתית','אי אפשר לדרג'],a:2,ex:'המחברים כותבים שנדרשים ניסויים גדולים וארוכים יותר. זו המסקנה הנכונה.'}
 ]},
{id:'elektd',tag:'פורץ דרך',d:3,title:'קטמין מול ECT בדיכאון עמיד (ELEKT-D)',cite:'Anand A et al. N Engl J Med 2023;388:2315-2325',pmid:'37224232',doi:'10.1056/NEJMoa2302399',
 design:'RCT פתוח (open-label) לאי-נחיתות, 403 מטופלים',
 why:'השוואה ישירה בין שני הטיפולים החזקים לדיכאון עמיד. מצוין ללימוד ניסויי אי-נחיתות.',

const KEY='paperlab.v1';
let store={xp:0,voice:false,all:false,lv:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');
  if(s){store=Object.assign(store,s);
    if(!s.lv&&(s.ans||s.l1done))store.lv={1:{ans:s.ans||{},pos:s.pos||0,done:!!s.l1done,best:s.best||0}};
    store.lv=store.lv||{}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function LV(n){return store.lv[n]||(store.lv[n]={ans:{},pos:0,done:false,best:0})}
function isOpen(n){return n===1||store.all||LV(n-1).done}

let view='home',L=LEVELS[0],i=0,answered=null,g=null;
const app=document.getElementById('app');

function strip(h){const d=document.createElement('div');d.innerHTML=h;d.querySelectorAll('svg').forEach(s=>s.remove());return d.textContent.replace(/\s+/g,' ').trim()}
let heVoice=null;
function pickVoice(){if(!('speechSynthesis' in window))return;heVoice=speechSynthesis.getVoices().find(v=>/^he|^iw/i.test(v.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text){
  if(!('speechSynthesis' in window))return false;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='he-IL';if(heVoice)u.voice=heVoice;u.rate=1;
  speechSynthesis.speak(u);return true;
}
function stopSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel()}
function perm(key,arr){let h=7;for(const c of key)h=(h*31+c.charCodeAt(0))|0;const idx=arr.map((_,k)=>k);
  for(let j=idx.length-1;j>0;j--){h=(Math.imul(h,1103515245)+12345)|0;const r=Math.abs(h)%(j+1);[idx[j],idx[r]]=[idx[r],idx[j]]}
  return idx.map(k=>[arr[k],k])}
function stepText(s){return s.t==='card'?[s.title,strip(s.body),strip(s.visual),s.take].join('. '):[s.q,...perm(s.q,s.opts).map(([o],k)=>'אפשרות '+(k+1)+': '+o)].join('. ')}

function topBar(){
  return `<div class="topbar"><span class="brand">מעבדת קריאת מאמרים</span><div class="stats">
  <span class="pill" title="נקודות ניסיון">XP ${store.xp}</span>
  <button class="pill toggle" id="voiceT" aria-pressed="${store.voice}" title="הקראה אוטומטית של כל כרטיס">🔊 הקראה אוטומטית</button>
  ${view!=='home'?'<button class="pill" id="homeB">מפת הרמות</button>':''}</div></div>`;
}
function wireTop(){
  document.getElementById('voiceT').onclick=()=>{store.voice=!store.voice;save();if(!store.voice)stopSpeak();render()};
  const h=document.getElementById('homeB');if(h)h.onclick=()=>{stopSpeak();view='home';render()};
}
app.addEventListener('click',e=>{
  const b=e.target.closest('.copy');if(!b)return;
  const pre=b.parentElement.querySelector('pre');const txt=pre?pre.textContent:'';
  const done=()=>{b.textContent='הועתק ✓';setTimeout(()=>{b.textContent='העתק'},1800)};
  const fallback=()=>{const r=document.createRange();r.selectNodeContents(pre);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);b.textContent='סמן והעתק'};
  try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(err){fallback()}
});

function openLevel(n){
  stopSpeak();L=LEVELS[n-1];const st=LV(n);
  if(st.done){view='done';g=null}else{view='lesson';i=Math.min(st.pos||0,L.steps.length-1)}
  render();
}

function renderHome(){
  const doneCount=LEVELS.filter(l=>LV(l.n).done).length;
  app.innerHTML=topBar()+`
  <section class="sheet">
    <div class="eyebrow"><span>הקורס שלך</span><span>${doneCount}/${LEVELS.length} רמות הושלמו</span></div>
    <h1>לקרוא מאמר כמו מומחה</h1>
    <p>שבע רמות, מהקל לקשה. כל רמה: כרטיסים קצרים עם הקראה קולית, שאלה אחרי כל רעיון, ומשחק בסוף. כל רמה נפתחת אחרי שמסיימים את המשחק של הרמה הקודמת.</p>
  </section>
  <div class="levels">${LEVELS.map(l=>{const st=LV(l.n),open=isOpen(l.n);
    const state=!open?'🔒 נעול':st.done?'✓ הושלם':st.pos>0?'▶ המשך':'▶ התחל';
    return `<button class="lvl ${open?'':'locked'}" data-n="${l.n}" ${open?'':'disabled'}>
    <span class="n">${l.n}</span><span><b>${l.name}</b><small>${l.sub}</small></span>
    <span class="state">${state}</span></button>`}).join('')}</div>
  <div class="row"><button class="btn" id="recapB">📋 סיכומי הפרקים</button></div>
  ${afterCourseHTML()}
  ${store.all?'':'<button class="linkbtn unlock" id="allB">לפתוח את כל הרמות בלי לחכות</button>'}`;
  wireTop();
  app.querySelectorAll('.lvl[data-n]:not([disabled])').forEach(b=>b.onclick=()=>openLevel(+b.dataset.n));
  document.getElementById('recapB').onclick=()=>{view='recaps';render()};
  wireAfterCourse();
  const ab=document.getElementById('allB');if(ab)ab.onclick=()=>{store.all=true;save();render()};
}

function renderLesson(){
  const st=LV(L.n);answered=st.ans[i]??null;st.pos=i;save();
  const s=L.steps[i],pct=Math.round(i/L.steps.length*100);
  let inner='';
  if(s.t==='card'){
    inner=`<div class="eyebrow"><span>רמה ${L.n} · ${L.name}</span><span>${i+1}/${L.steps.length}</span></div>
    <h2>${s.title}</h2><div class="term">${s.term}</div>${s.body}${s.visual||''}<p class="take">${s.take}</p>`;
  }else{
    inner=`<div class="eyebrow"><span>בדוק את עצמך</span><span>${i+1}/${L.steps.length}</span></div>
    <h3>${s.q}</h3><div class="opts">${perm(s.q,s.opts).map(([o,k])=>{
      let c='';if(answered!==null){if(k===s.a)c='right';else if(k===answered)c='wrong'}
      return `<button class="opt ${c}" data-k="${k}" ${answered!==null?'disabled':''}>${o}</button>`}).join('')}</div>
    ${answered!==null?`<div class="feedback ${answered===s.a?'ok':'no'}"><strong>${answered===s.a?'נכון! +10 XP':'לא בדיוק.'}</strong>${s.ex}</div>`:''}`;
  }
  const canNext=s.t==='card'||answered!==null;
  app.innerHTML=topBar()+`<div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>
  <section class="sheet">${inner}</section>
  <div class="row actions"><button class="btn" id="readB">🔊 הקרא</button><span class="spacer"></span>
  <span class="nav">${i>0?'<button class="btn back" id="prevB" aria-label="הקודם">→ חזרה</button>':''}<button class="btn primary" id="nextB" ${canNext?'':'disabled'}>${i===L.steps.length-1?'למשחק ←':'הבא ←'}</button></span></div>
  <p class="note" id="voiceNote" hidden>לא נמצא במכשיר קול בעברית. אפשר להוסיף קול עברי בהגדרות ההקראה של המכשיר.</p>`;
  wireTop();
  document.getElementById('readB').onclick=()=>{const ok=speak(stepText(s));if(!ok||!heVoice)document.getElementById('voiceNote').hidden=false};
  const p=document.getElementById('prevB');if(p)p.onclick=()=>{stopSpeak();i--;render()};
  document.getElementById('nextB').onclick=()=>{stopSpeak();if(i===L.steps.length-1){startGame();return}i++;render()};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{answered=+b.dataset.k;st.ans[i]=answered;if(answered===s.a){store.xp+=10}save();render();
    if(store.voice)speak((answered===s.a?'נכון. ':'לא בדיוק. ')+s.ex)});
  if(store.voice&&s.t==='card')speak(stepText(s));
}

function startGame(){
  stopSpeak();view='game';
  g={i:0,score:0,streak:0,ans:null,answers:[],showHe:false,order:L.game.items.map((_,k)=>k).sort(()=>Math.random()-.5)};render();
}
function renderGame(){
  const G=L.game,it=G.items[g.order[g.i]];g.ans=g.answers[g.i]??null;
  const opts=it.opts||G.opts,shared=!it.opts;
  const q=G.ltr?`<div class="snippet">${it.s}</div>${g.showHe?`<p class="trans">${it.he}</p>`:'<button class="linkbtn" id="heB">הצג תרגום</button>'}`
               :(it.s.startsWith('<')?it.s:`<p class="qcard">${it.s}</p>`);
  app.innerHTML=topBar()+`<div class="progress" aria-hidden="true"><i style="width:${Math.round(g.i/G.items.length*100)}%"></i></div>
  <section class="sheet">
    <div class="eyebrow"><span>משחק · ${G.title}</span><span>${g.i+1}/${G.items.length}</span></div>
    <div class="row"><span class="pill">ניקוד ${g.score}</span><span class="pill ${g.streak>1?'streak':''}">🔥 רצף ${g.streak}</span></div>
    <h3>${G.prompt}</h3>${q}
    <div class="${shared&&opts.length>4?'sections ':''}opts">${(shared?opts.map((o,k)=>[o,k]):perm(it.s,opts)).map(([o,k])=>{let c='';if(g.ans!==null){if(k===it.a)c='right';else if(k===g.ans)c='wrong'}
      return `<button class="opt ${c}" data-k="${k}" ${g.ans!==null?'disabled':''}>${o}</button>`}).join('')}</div>
    ${g.ans!==null?`<div class="feedback ${g.ans===it.a?'ok':'no'}"><strong>${g.ans===it.a?'נכון!':'התשובה: '+opts[it.a]}</strong>${it.ex}</div>`:''}
  </section>
  <div class="row actions"><span class="spacer"></span><span class="nav">${g.i>0?'<button class="btn back" id="prevG" aria-label="הקודם">→ חזרה</button>':''}<button class="btn primary" id="nextG" ${g.ans===null?'disabled':''}>${g.i===G.items.length-1?'לתוצאה ←':'הבא ←'}</button></span></div>`;
  wireTop();
  const hb=document.getElementById('heB');if(hb)hb.onclick=()=>{g.showHe=true;render()};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{g.ans=+b.dataset.k;g.answers[g.i]=g.ans;
    if(g.ans===it.a){g.score++;g.streak++;store.xp+=5+Math.min(g.streak,5);save()}else g.streak=0;render();
    if(store.voice)speak((g.ans===it.a?'נכון. ':'התשובה היא '+opts[it.a]+'. ')+strip(it.ex))});
  document.getElementById('nextG').onclick=()=>{stopSpeak();
    if(g.i===G.items.length-1){const st=LV(L.n);st.done=true;st.best=Math.max(st.best||0,g.score);save();view='done';render();return}
    g.i++;g.showHe=false;render()};
  const pg=document.getElementById('prevG');if(pg)pg.onclick=()=>{stopSpeak();g.i--;g.showHe=false;render()};
}
function renderDone(){
  const st=LV(L.n),N=L.game.items.length,next=LEVELS[L.n];
  const head=g?`<div class="big">${g.score}/${N}</div><h2>${g.score>=N*.8?'מצוין. זה כבר יושב לך טוב.':g.score>=N*.6?'יפה מאוד. עוד סיבוב אחד וזה יתקבע.':'התחלה טובה. כדאי לשחק שוב מחר: חזרה מרווחת היא הדרך הכי טובה לזכור.'}</h2>`
              :`<h2>רמה ${L.n}: ${L.name}</h2><p class="note">השיא שלך במשחק: ${st.best}/${N}</p>`;
  app.innerHTML=topBar()+`<section class="sheet">
    <div class="eyebrow"><span>רמה ${L.n} הושלמה</span><span>XP ${store.xp}</span></div>
    ${head}
    <p><b>מה לקחת מהרמה הזו:</b> ${L.summary}</p>
    <p class="take">תרגיל לשבוע: ${L.homework}</p>
    ${next?`<p class="note">הרמה הבאה: ${next.name}. ${next.sub}.</p>`:'<p class="note">סיימת את כל הקורס. מכאן, כל מאמר שתקרא הוא תרגול.</p>'}
  </section>
  <div class="row actions"><button class="btn" id="reviewB">לכרטיסים</button><button class="btn" id="againB">שחק שוב</button><span class="spacer"></span>
  ${next?'<button class="btn primary" id="nextL">לרמה הבאה ←</button>':'<button class="btn primary" id="mapB">למפת הרמות</button>'}</div>`;
  wireTop();
  document.getElementById('reviewB').onclick=()=>{view='lesson';i=0;render()};
  document.getElementById('againB').onclick=startGame;
  const nl=document.getElementById('nextL');if(nl)nl.onclick=()=>openLevel(next.n);
  const mb=document.getElementById('mapB');if(mb)mb.onclick=()=>{view='home';render()};
}
function renderRecaps(){
  app.innerHTML=topBar()+`<section class="sheet"><div class="eyebrow"><span>דף סיכום</span><span>${LEVELS.length} פרקים</span></div>
  <h1>סיכומי הפרקים</h1><p>כל הנקודות החשובות של הקורס, במקום אחד. טוב לחזרה לפני journal club.</p></section>
  ${LEVELS.map(l=>`<section class="sheet"><div class="eyebrow"><span>פרק ${l.n}</span><span>${LV(l.n).done?'✓ הושלם':''}</span></div>
  <h2>${l.name}</h2><ul class="checklist recap">${RECAPS[l.n].map(x=>'<li>'+x+'</li>').join('')}</ul>
  <button class="btn speakR" data-n="${l.n}">🔊 הקרא</button></section>`).join('')}`;

  app.querySelectorAll('.speakR').forEach(b=>b.onclick=()=>{const l=LEVELS[b.dataset.n-1];speak(l.name+'. '+RECAPS[l.n].join(' '))});

function render(){({home:renderHome,lesson:renderLesson,game:renderGame,done:renderDone,recaps:renderRecaps,reading:renderReading,paper:renderPaper,bank:renderBank,bankq:renderBankQ})[view]();window.scrollTo({top:0})}

store.rd=store.rd||{};store.bankBest=store.bankBest||{};
var P=null,pi=-1,bq=null;
const DIFF={1:'קל',2:'בינוני',3:'קשה'};
function dots(d){return '<span class="dots-d" aria-label="קושי '+DIFF[d]+'">'+'●'.repeat(d)+'○'.repeat(3-d)+'</span>'}

  return `<section class="sheet after ${open?'':'locked'}">

    <div class="after-grid">
      <button class="tile" id="readingB" ${open?'':'disabled'}><b>📖 חדר קריאה</b><span>${PAPERS.length} מאמרים מרכזיים בפסיכיאטריה. קוראים, ואז עונים על שאלות ברמה גבוהה.</span><em>${readN}/${PAPERS.length} הושלמו</em></button>
      <button class="tile" id="bankB" ${open?'':'disabled'}><b>🎯 בנק מבחן</b><span>${BANK.length} תקצירים, טובים וחלשים, בשלוש דרגות קושי.</span><em>${Object.keys(store.bankBest).length?'שיא: '+Object.entries(store.bankBest).map(([k,v])=>(DIFF[k]||'מעורב')+' '+v).join(' · '):'עוד לא התחלת'}</em></button>
    </div></section>`;
}
function wireAfterCourse(){
  const r=document.getElementById('readingB');if(r&&!r.disabled)r.onclick=()=>{view='reading';render()};
  const b=document.getElementById('bankB');if(b&&!b.disabled)b.onclick=()=>{view='bank';render()};
}

function renderReading(){
  app.innerHTML=topBar()+`<section class="sheet"><div class="eyebrow"><span>חדר קריאה</span><span>${PAPERS.length} מאמרים</span></div>
  <h1>מאמרים מרכזיים</h1><p>בחר מאמר, קרא אותו בעיון, ורק אז לחץ "קראתי". השאלות מניחות שקראת את המאמר עצמו, לא רק את התקציר. אם אין לך גישה למאמר, אפשר לשלוח לי אותו בצ'אט.</p>
  <div class="legend"><span><span class="pill">קלאסי</span> מאמרים שעיצבו את התחום</span><span><span class="pill hot">פורץ דרך</span> מהשנים האחרונות</span></div></section>
  <div class="levels">${PAPERS.map(p=>{const r=RD(p.id);return `<button class="lvl paperbtn" data-id="${p.id}">
    <span class="pill ${p.tag==='פורץ דרך'?'hot':''}">${p.tag}</span><span><b>${p.title}</b><small class="en">${p.cite}</small></span>
    <span class="state">${r.done?'✓ '+r.score+'/'+p.qs.length:dots(p.d)}</span></button>`}).join('')}</div>`;
  wireTop();
  app.querySelectorAll('.paperbtn').forEach(b=>b.onclick=()=>{P=PAPERS.find(x=>x.id===b.dataset.id);pi=-1;view='paper';render()});
}

function renderPaper(){
  const r=RD(P.id);
  if(pi===-1){
    app.innerHTML=topBar()+`<section class="sheet">
      <div class="eyebrow"><span>${P.tag} · קושי ${DIFF[P.d]}</span>${dots(P.d)}</div>
      <h2>${P.title}</h2><div class="term">${P.cite}</div>
      <p><b>סוג המחקר:</b> ${P.design}</p>
      <p><b>למה לקרוא:</b> ${P.why}</p>
      <div class="example"><span class="tag">מה לחפש בזמן הקריאה</span><ol class="seq">${P.look.map(x=>'<li><span>'+x+'</span></li>').join('')}</ol></div>
      <div class="row links"><a class="btn" href="https://pubmed.ncbi.nlm.nih.gov/${P.pmid}/" target="_blank" rel="noopener">פתח ב-PubMed</a><a class="btn" href="https://doi.org/${P.doi}" target="_blank" rel="noopener">המאמר המלא</a></div>
      <p class="note">חלק מהמאמרים דורשים מנוי. אפשר לגשת דרך הספרייה של בית החולים או האוניברסיטה.</p>
    </section>
    <div class="row actions"><button class="btn" id="backList">לרשימה</button><span class="spacer"></span><button class="btn primary" id="readDone">${r.done?'לשאלות שוב':'קראתי, אפשר לשאול ←'}</button></div>`;
    wireTop();
    document.getElementById('backList').onclick=()=>{view='reading';render()};
    document.getElementById('readDone').onclick=()=>{pi=0;render()};
    return;
  }
  if(pi>=P.qs.length){
    const score=P.qs.filter((q,k)=>r.ans[k]===q.a).length;r.done=true;r.score=score;save();
    app.innerHTML=topBar()+`<section class="sheet"><div class="eyebrow"><span>${P.title}</span><span>XP ${store.xp}</span></div>
      <div class="big">${score}/${P.qs.length}</div><h2>${score===P.qs.length?'קריאה של מומחה.':score>=3?'קריאה טובה. שווה לחזור לשאלות שפספסת.':'שווה לקרוא שוב את Methods ואת Results, ולנסות שוב.'}</h2>
      <p class="take">רוצה להעמיק? שלח לי בצ'אט: "בוא נדבר על ${P.title}", ואשאל אותך שאלות פתוחות על המאמר.</p></section>
      <div class="row actions"><button class="btn" id="again">לנסות שוב</button><span class="spacer"></span><button class="btn primary" id="toList">למאמר הבא ←</button></div>`;
    wireTop();
    document.getElementById('again').onclick=()=>{r.ans={};save();pi=0;render()};
    document.getElementById('toList').onclick=()=>{view='reading';render()};
    return;
  }
  const q=P.qs[pi],ans=r.ans[pi]??null;
  app.innerHTML=topBar()+`<div class="progress" aria-hidden="true"><i style="width:${Math.round(pi/P.qs.length*100)}%"></i></div>
  <section class="sheet"><div class="eyebrow"><span>${P.title}</span><span>${pi+1}/${P.qs.length}</span></div>
    <h3>${q.q}</h3><div class="opts">${perm(q.q,q.opts).map(([o,k])=>{let c='';if(ans!==null){if(k===q.a)c='right';else if(k===ans)c='wrong'}
      return `<button class="opt ${c}" data-k="${k}" ${ans!==null?'disabled':''}>${o}</button>`}).join('')}</div>
    ${ans!==null?`<div class="feedback ${ans===q.a?'ok':'no'}"><strong>${ans===q.a?'נכון! +15 XP':'לא בדיוק.'}</strong>${q.ex}</div>`:''}
  </section>
  <div class="row actions"><button class="btn" id="readB">🔊 הקרא</button><span class="spacer"></span><span class="nav"><button class="btn back" id="prevP">→ חזרה</button><button class="btn primary" id="nextP" ${ans===null?'disabled':''}>${pi===P.qs.length-1?'לתוצאה ←':'הבא ←'}</button></span></div>`;
  wireTop();
  document.getElementById('readB').onclick=()=>speak([q.q,...perm(q.q,q.opts).map(([o],k)=>'אפשרות '+(k+1)+': '+o)].join('. '));
  document.getElementById('prevP').onclick=()=>{stopSpeak();pi--;render()};
  document.getElementById('nextP').onclick=()=>{stopSpeak();pi++;render()};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;r.ans[pi]=k;if(k===q.a)store.xp+=15;save();render();
    if(store.voice)speak((k===q.a?'נכון. ':'לא בדיוק. ')+q.ex)});
}

function renderBank(){
  const cnt=d=>BANK.filter(x=>!d||x.d===d).length;
  const choices=[[1,'קל','זיהוי סוג מחקר וחישובים פשוטים'],[2,'בינוני','הטיות, NNT ופרשנות של תוצאות'],[3,'קשה','אי-נחיתות, מדדים עקיפים, מחקרים אקולוגיים ו-GRADE'],[0,'מעורב','שאלות מכל הרמות']];
  app.innerHTML=topBar()+`<section class="sheet"><div class="eyebrow"><span>בנק מבחן</span><span>${BANK.length} שאלות</span></div>
    <h1>מבחן תרגול</h1><p>כל סבב: עד 10 תקצירים אקראיים. חלקם מאמרים אמיתיים וחלקם תקצירים מומצאים לתרגול, וזה מצוין בכל שאלה. בחר דרגת קושי:</p></section>
  <div class="levels">${choices.map(([d,n,sub])=>`<button class="lvl bankbtn" data-d="${d}"><span class="n">${d?dots(d):'∗'}</span><span><b>${n}</b><small>${sub}</small></span><span class="state">${cnt(d)} שאלות${store.bankBest[d]!=null?' · שיא '+store.bankBest[d]:''}</span></button>`).join('')}</div>`;
  wireTop();
  app.querySelectorAll('.bankbtn').forEach(b=>b.onclick=()=>{const d=+b.dataset.d;
    const pool=BANK.filter(x=>!d||x.d===d).sort(()=>Math.random()-.5).slice(0,10);
    bq={d,items:pool,i:0,answers:[]};view='bankq';render()});
}
function renderBankQ(){
  const N=bq.items.length;
  if(bq.i>=N){
    const score=bq.items.filter((x,k)=>bq.answers[k]===x.a).length;
    store.bankBest[bq.d]=Math.max(store.bankBest[bq.d]||0,score);save();
    const byKind={};bq.items.forEach((x,k)=>{byKind[x.k]=byKind[x.k]||[0,0];byKind[x.k][1]++;if(bq.answers[k]===x.a)byKind[x.k][0]++});
    app.innerHTML=topBar()+`<section class="sheet"><div class="eyebrow"><span>בנק מבחן · ${DIFF[bq.d]||'מעורב'}</span><span>XP ${store.xp}</span></div>
      <div class="big">${score}/${N}</div><h2>${score>=N*.8?'מצוין.':score>=N*.6?'טוב מאוד. עוד סבב יחזק את זה.':'כדאי לחזור לפרקים הרלוונטיים ולנסות שוב.'}</h2>
      <ul class="checklist">${Object.entries(byKind).map(([k,[a,t]])=>`<li><b>${k}</b> · ${a} מתוך ${t}</li>`).join('')}</ul></section>
      <div class="row actions"><button class="btn" id="bankHome">בחירת קושי</button><span class="spacer"></span><button class="btn primary" id="bankAgain">סבב חדש ←</button></div>`;
    wireTop();
    document.getElementById('bankHome').onclick=()=>{view='bank';render()};
    document.getElementById('bankAgain').onclick=()=>{const d=bq.d;bq={d,items:BANK.filter(x=>!d||x.d===d).sort(()=>Math.random()-.5).slice(0,10),i:0,answers:[]};render()};
    return;
  }
  const it=bq.items[bq.i],ans=bq.answers[bq.i]??null;
  app.innerHTML=topBar()+`<div class="progress" aria-hidden="true"><i style="width:${Math.round(bq.i/N*100)}%"></i></div>
  <section class="sheet"><div class="eyebrow"><span>${it.k} · ${DIFF[it.d]}</span><span>${bq.i+1}/${N}</span></div>
    <div class="paperc"><span class="tag">${it.s.startsWith('אמיתי')?'מאמר אמיתי':'תקציר מומצא לתרגול'}</span>${it.s.replace(/^(אמיתי|תקציר מומצא): /,'')}</div>
    <h3>${it.q}</h3><div class="opts">${perm(it.s,it.opts).map(([o,k])=>{let c='';if(ans!==null){if(k===it.a)c='right';else if(k===ans)c='wrong'}
      return `<button class="opt ${c}" data-k="${k}" ${ans!==null?'disabled':''}>${o}</button>`}).join('')}</div>
    ${ans!==null?`<div class="feedback ${ans===it.a?'ok':'no'}"><strong>${ans===it.a?'נכון!':'התשובה: '+it.opts[it.a]}</strong>${it.ex}</div>`:''}
  </section>
  <div class="row actions"><span class="spacer"></span><span class="nav">${bq.i>0?'<button class="btn back" id="prevQ">→ חזרה</button>':''}<button class="btn primary" id="nextQ" ${ans===null?'disabled':''}>${bq.i===N-1?'לתוצאה ←':'הבא ←'}</button></span></div>`;
  wireTop();
  const pq=document.getElementById('prevQ');if(pq)pq.onclick=()=>{bq.i--;render()};
  document.getElementById('nextQ').onclick=()=>{bq.i++;render()};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;bq.answers[bq.i]=k;if(k===it.a)store.xp+=5+it.d*2;save();render()});
}
render();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script>
</body>
</html>
